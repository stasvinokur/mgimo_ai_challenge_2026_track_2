name: pulse

x-database-env: &database-env
  DATABASE_URL: ${DATABASE_URL:?задайте DATABASE_URL в .env}
  TZ: Europe/Moscow

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      TZ: Europe/Moscow
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD", "pg_isready", "--username=pulse", "--dbname=pulse"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    security_opt: [no-new-privileges:true]

  migrate:
    build:
      context: .
      target: migrator
    image: ${IMAGE_REPO:-pulse}/migrator:${IMAGE_TAG:?задайте IMAGE_TAG в .env}
    environment:
      <<: *database-env
      DEMO_ACCOUNT_PASSWORDS: ${DEMO_ACCOUNT_PASSWORDS:-}
    command: ["sh", "-ec", "pnpm db:migrate && pnpm db:seed && pnpm demo:refresh"]
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  app:
    build:
      context: .
      target: runtime
      args:
        BASE_PATH: ${BASE_PATH:-}
    image: ${IMAGE_REPO:-pulse}/app:${IMAGE_TAG:?задайте IMAGE_TAG в .env}
    restart: unless-stopped
    environment:
      <<: *database-env
      APP_ORIGIN: ${APP_ORIGIN:?задайте APP_ORIGIN в .env}
      APP_VERSION: ${IMAGE_TAG:?задайте IMAGE_TAG в .env}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-}
      # Tests and CI only (D-26); unset in production.
      ASSISTANT_RUNTIME: ${ASSISTANT_RUNTIME:-}
      ICS_TOKEN_SECRET: ${ICS_TOKEN_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      TTS_URL: ${TTS_URL:-}
      DEMO_LOGIN_HINTS: ${DEMO_LOGIN_HINTS:-on}
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal, egress, speech]
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1001,gid=1001,mode=1770
      - /app/.next/cache:rw,noexec,nosuid,size=128m,uid=1001,gid=1001,mode=0770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  tts:
    profiles: [tts]
    build:
      context: ./infra/tts
    image: ${IMAGE_REPO:-pulse}/tts:${IMAGE_TAG:?задайте IMAGE_TAG в .env}
    restart: unless-stopped
    networks: [speech]
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1001,gid=1001,mode=1770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 1536m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

  scheduler:
    image: ${IMAGE_REPO:-pulse}/migrator:${IMAGE_TAG:?задайте IMAGE_TAG в .env}
    restart: unless-stopped
    environment: *database-env
    command: ["crond", "-f", "-l", "8", "-L", "/dev/stdout", "-c", "/etc/crontabs"]
    networks: [internal]
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp, /var/run]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && pidof crond >/dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: pulse
      PGUSER: pulse
      PGPASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      TZ: Europe/Moscow
    entrypoint: ["sh", "/opt/pulse/backup-entrypoint.sh"]
    volumes:
      - backups:/backups
      - ./infra/cron/backup:/etc/crontabs/root:ro
      - ./infra/backup-entrypoint.sh:/opt/pulse/backup-entrypoint.sh:ro
      - ./infra/backup.sh:/opt/pulse/backup.sh:ro
    networks: [internal]
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp, /var/run]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && pidof crond >/dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  internal:
    internal: true
  speech:
    internal: true
  egress: {}

volumes:
  postgres-data:
  backups:
